<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Wallpapers - Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">All Wallpapers</a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="library.html" class="nav-link">Library</a>
      </nav>
    </div>
  </header>

  <main class="container library">
    <h2 class="section-title">Library</h2>
    <p class="section-sub">Browse our futuristic collection of wallpapers.</p>

    <section class="grid">
      <div id="gridContainer">
        <!-- Voeg wallpapers toe met download functionaliteit -->
        <article class="card">
          <a href="wallpapers/dark windows.jpg" download>
            <img src="wallpapers/dark windows.jpg" alt="Dark Windows" class="placeholder" />
          </a>
        </article>
        <article class="card">
          <a href="wallpapers/inspire.jpg" download>
            <img src="wallpapers/inspire.jpg" alt="Inspire" class="placeholder" />
          </a>
        </article>
        <article class="card">
          <a href="wallpapers/moon snipe.jpg" download>
            <img src="wallpapers/moon snipe.jpg" alt="Moon Snipe" class="placeholder" />
          </a>
        </article>
        <article class="card">
          <a href="wallpapers/night city.jpg" download>
            <img src="wallpapers/night city.jpg" alt="Night City" class="placeholder" />
          </a>
        </article>
        <article class="card">
          <a href="wallpapers/pink and purple gradient.jpg" download>
            <img src="wallpapers/pink and purple gradient.jpg" alt="Pink and Purple Gradient" class="placeholder" />
          </a>
        </article>
        <article class="card">
          <a href="wallpapers/purple neon fluid.png" download>
            <img src="wallpapers/purple neon fluid.png" alt="Purple Neon Fluid" class="placeholder" />
          </a>
        </article>
        <article class="card">
          <a href="wallpapers/red and blue gradient.jpg" download>
            <img src="wallpapers/red and blue gradient.jpg" alt="Red and Blue Gradient" class="placeholder" />
          </a>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <small>© <span id="yearLib"></span> All Wallpapers</small>
      <div class="controls">
        <label class="theme-toggle">
          <input type="checkbox" id="themeSwitch" aria-label="Toggle light dark mode">
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
