<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futuristic Wallpapers</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Futuristic Wallpapers</a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="library.html" class="nav-link">Library</a>
      </nav>
    </div>
  </header>

  <main class="container hero">
    <div class="hero-card">
      <h1 class="hero-title">Welcome to the Future</h1>
      <p class="hero-tagline">Explore a bold collection of wallpapers designed for the modern era.</p>
      <p class="hero-description">Dive into a world of neon glow, futuristic designs, and minimalistic beauty. Perfect for gamers, tech enthusiasts, and design lovers.</p>
      <a class="btn-explore" href="library.html" id="exploreBtn">Explore</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <small>© <span id="year"></span> Futuristic Wallpapers</small>
      <div class="controls">
        <label class="theme-toggle">
          <input type="checkbox" id="themeSwitch" aria-label="Toggle light dark mode">
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
